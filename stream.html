<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component with Buttons</title>
    <link rel="stylesheet" href="stream.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Container for all cards -->
    <div class="card-container">
        <!-- Card 1 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1707247111552-aaf74241058b?q=80&w=1848&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Power Consumption">
            <div class="card-details">
                <p class="text-title">Power Consumption</p>
                <p class="text-body">Over 10 years of hourly energy consumption data</p>
                <div class="button-container">
                    <button class="card-button" onclick="window.location.href='https://super-duper-meme-69vr7rrvj4pq34q49-8501.app.github.dev'">View Data</button>
                    
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card">
            <img src="https://learn.microsoft.com/en-us/power-bi/create-reports/media/desktop-visual-elements-for-reports/visual-elements-for-reports_01.png" alt="Power BI Report">
            <div class="card-details">
                <p class="text-title">Power BI Report</p>
                <p class="text-body">Click the button to view the report</p>
                <div class="button-container">
                    <a href="../powerbi/powerbi.html" class="card-button">View Data</a>
                    <!-- <button class="card-button" onclick="window.location.href=">View Data</button> -->
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=2069&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="EDA">
            <div class="card-details">
                <p class="text-title">Exploratory Data Analysis</p>
                <p class="text-body">Detailed insights and visualizations</p>
                <div class="button-container">
                    
                    <button class="card-button" onclick="window.location.href='https://colab.research.google.com/drive/1ZxK-UVSP3UDvCSw4VzRKBI-EBaoQjafv?usp=sharing'">ANALYSE</button>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
